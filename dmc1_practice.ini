; DMC1 Practice Mod by waifu - settings
; Lives next to dinput8.dll in the Devil May Cry HD Collection folder.
; Edit with any text editor, then restart the game. Problems are written to dmc1_practice.log.
;
; Keys (all changeable below; values are Windows key codes: 0x70 = F1, 0x71 = F2 ... 0x7B = F12)
;   F10 turn the whole mod on / off (it starts off: plain DMC1 until you press it)
;   F1  show / hide the overlay
;   F2  practice menu: load a preset, make or edit one, delete one
;   F3  restart the mission instantly
;   F4  restart the current room (back to how it was when you came in)
;   F7  save your current loadout as a preset for this mission

[Overlay]
; The whole mod on / off. While it's on, the game saves to dmc1_practice.sav next to the mod
; instead of your real dmc1.sav (your save is also backed up to dmc1_save_backups every start).
ModKey = 0x79
; 1 = on as soon as the game starts.
ModOnAtStart = 0
ToggleKey = 0x70
ShowOnStart = 1
; Size of everything the mod draws. auto = scaled to the game's resolution, so it takes up the
; same share of the screen at 1080p as at 1440p (the sizes below are for a 1440p window).
; Or a number to pick yourself: 1 = the 1440p size, 0.75 = 1080p size, 1.2 = a bit bigger.
UiScale = auto
; Font for all the mod's text: EB Garamond (fonts\EBGaramond-Regular.ttf) by default. To use
; another font, put its full path (or a path relative to dinput8.dll) here. TimerFont below
; changes just the timers.
;Font = C:\Windows\Fonts\seguisb.ttf
; Big mission timer + room timer, centered at the top of the screen.
; Sizes are text height in pixels at 1440p (scaled with UiScale).
TimerSize = 88
RoomTimerSize = 48
TimerPosY = 16
; Box behind the timers: darkness (0 = no box, just text with a drop shadow), red border width
; in pixels (0 = none), and the box's drop shadow (1 on, 0 off).
TimerBackgroundAlpha = 0.55
TimerBorderSize = 2
TimerShadow = 1
;TimerFont = C:\Windows\Fonts\seguisb.ttf
; Stats panel. Screen corner: TopLeft, TopRight, BottomLeft, BottomRight
Anchor = BottomLeft
; Gap in pixels from that corner's edges
PosX = 20
PosY = 20
FontScale = 1.5
; Key reminders (F1 / F2 / F3 / F4) at the bottom of the stats panel. 0 = hide.
ShowKeyHints = 1
BackgroundAlpha = 0.55
; Other mod DLLs to load alongside this one (e.g. a camera mod renamed to dmc1_cam.dll).
;ChainLoad = dmc1_cam.dll
; Game executable and frame rate of its timers (leave as is).
TargetExe = dmc1.exe
TicksPerSecond = 60

[Practice]
; Category you're practicing. Personal bests are kept per category and mission in
; dmc1_practice_pbs.txt. Loading a preset switches this to the preset's name, so each preset
; (e.g. "DMD LDK") keeps its own PBs. This value is only used until you load one.
Category = Any% Normal
; Line under the room timer: your PB while playing, then NEW PB (gold) or +time (red) at the end.
ShowPB = 1
PBSize = 34

[Presets]
; F2 practice menu. Up/Down select, Enter choose / load, E edit, S sort (mission / name /
; newest first), Delete delete, Backspace back, Esc close. "+ New preset..." opens the preset editor.
;   In a mission: the preset loads straight away (no title screen).
;   At the title screen: it's written to PracticeSlot; then Load Game -> that slot.
; Only PracticeSlot is ever written. dmc1.sav is backed up once, before the first write, to
; dmc1.sav.practice_backup next to it.
Enabled = 1
MenuKey = 0x71
PracticeSlot = 10
; Folder of presets, next to this file: one subfolder per category, one .json per preset.
PresetFolder = presets
; dmc1.sav is found through Steam automatically. If that fails, put the full path here:
;SaveFile = C:\Program Files (x86)\Steam\userdata\<your id>\631510\remote\dmc1.sav
SaveFile =
; F7 saves your current loadout (difficulty, costume, orbs, HP/DT bars, DT gauge, moves, items,
; weapons, equipped weapons) as presets\<CaptureCategory>\Mxx.json. The preset editor saves there
; too. Rename the folder to name the category.
CaptureKey = 0x76
CaptureCategory = My Presets

[Reset]
; F3: restart the mission from how it began, with the loadout you started with.
Enabled = 1
ResetKey = 0x72
; F4: back to how the room was when you came in: same door, HP, DT, items, orbs, enemies / boss
; back, mission timer set back to the entry time. Your equipped weapons stay as they are.
; A mission where you used F4 doesn't count for a PB. 0 = off.
RoomResetKey = 0x73

[Criteria]
; Rank criteria for the current mission (targets from dmc.wiki/dmc1:rank): live value / target
; and points for time, orbs and damage, item penalty, secret mission bonus, and the projected
; total and rank (S at 1000, or 700 on Dante Must Die), plus "SB" at 1500 (special bonus).
; Targets can be corrected in dmc1_criteria.csv.
Enabled = 1
; Grey column with what the next bracket needs (time left, orbs needed, damage until it drops).
ShowHints = 1

; ==============================================================================================
; Advanced: game addresses and debugging. Leave these as they are unless you know you need to.
; "@Name" addresses are found in the game's code at startup, so they work on any game build.
; ==============================================================================================

[Debug]
; Detailed step-by-step tracing in the log (useful when reporting a bug). 0 = off.
VerboseLog = 0
; Research memory dump to dumps\NNN\ (0x74 = F5). Large (hundreds of MB). 0 = off.
DumpKey = 0
DebugReloadKey = 0

[StatFix]
; When a mission starts, sets max HP / DT to match the loaded HP / DT bars.
Enabled = 1
HpBar = @Session -> 2464
DtBar = @Session -> 2465
MaxHp = @Actor -> 1BC8
MaxDt = @Actor -> 1BD4
MaxGauge = @Actor -> 1BD0
Hp    = @Actor -> 17A2
Dt    = @Actor -> 1BCE

[MissionTimer]
;   Gray  = no mission started yet since launch
;   White = running
;   Green = mission finished, frozen on the game's official time
Enabled    = 1
Counter    = @Session -> BC
StartFrame = @StartFrame
FinalTime  = @Session -> 2310
RoomTimer  = @Stage -> 18
MissionNumber = @Session -> 1E64
; Menu state: 517 = main menu (the timer stops when you quit to the title).
ActiveFlag    = @Session -> 2A10
ActiveType    = i32
InactiveValue = 517

[Watch]
; Stats panel rows: Group | Name | Address | Type | Format
;   Address: hex (00102510), dmc1.exe+offset, @Session / @Stage / @Actor / @StartFrame / @NextPos,
;            pointer chains (@Session -> 2A10), or "$category" / "$pb" with type text.
;   Type: u8 i8 u16 i16 u32 i32 f32 text.   Format: int, time, float, hex
Mission | Preset             | $category | text
Mission | Mission #          | @Session -> 1E64 | u8 | int
Mission | PB                 | $pb | text
;Mission | Orbs               | @Session -> 264C | i32 | int
;Mission | Damage             | @Session -> 2648 | i32 | int
;Mission | Item Penalty       | @Session -> 2650 | i16 | int
;Mission | Secret Mission Bonus | @Session -> 2680 | i16 | int
